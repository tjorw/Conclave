<div class="login-page">
  <div class="login-card">

    <h1 class="login-title">{{ labels().loginTitle }}</h1>

    @if (error()) {
      <div class="error-banner">{{ error() }}</div>
    }

    <form [formGroup]="form" (ngSubmit)="login()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ labels().loginEmail }}</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>{{ labels().loginPassword }}</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
      </mat-form-field>

      <button mat-flat-button class="submit-btn full-width" type="submit"
              [disabled]="form.invalid || loading()">
        @if (loading()) {
          <mat-spinner diameter="20" />
        } @else {
          {{ labels().loginButton }}
        }
      </button>
    </form>

    <a class="forgot-link" routerLink="/forgot-password">{{ labels().loginForgotPassword }}</a>

    <p class="register-link">
      {{ labels().loginNoAccount }} <a routerLink="/register">{{ labels().loginCreateAccount }}</a>
    </p>

  </div>
</div>
