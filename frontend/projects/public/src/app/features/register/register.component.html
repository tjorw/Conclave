<div class="auth-page">
  <div class="auth-card">

    <h1>Skapa konto</h1>

    @if (success()) {
      <div class="success-banner">
        <p>Konto skapat! Kontrollera din inkorg och klicka på bekräftelselänken för att aktivera ditt konto.</p>
        <a routerLink="/login">Gå till inloggning</a>
      </div>
    } @else {

      @if (error()) {
        <div class="error-banner">{{ error() }}</div>
      }

      <form [formGroup]="form" (ngSubmit)="register()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>E-postadress</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Lösenord</mat-label>
          <input matInput type="password" formControlName="password" autocomplete="new-password" />
          <mat-hint>Minst 6 tecken</mat-hint>
        </mat-form-field>

        <button mat-flat-button class="submit-btn full-width" type="submit"
                [disabled]="form.invalid || loading()">
          @if (loading()) {
            <mat-spinner diameter="20" />
          } @else {
            Skapa konto
          }
        </button>
      </form>

      <p class="footer-link">
        Har du redan ett konto? <a routerLink="/login">Logga in</a>
      </p>

    }

  </div>
</div>
