<div class="auth-page">
  <div class="auth-card">

    <h1>{{ labels().forgotTitle }}</h1>

    @if (success()) {
      <div class="success-banner">
        <p>{{ labels().forgotSuccessText }}</p>
        <a routerLink="/login">{{ labels().forgotBackToLogin }}</a>
      </div>
    } @else {
      <p class="description">{{ labels().forgotDescription }}</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>{{ labels().forgotEmail }}</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <button mat-flat-button class="submit-btn full-width" type="submit"
                [disabled]="form.invalid || loading()">
          @if (loading()) {
            <mat-spinner diameter="20" />
          } @else {
            {{ labels().forgotButton }}
          }
        </button>
      </form>

      <p class="footer-link"><a routerLink="/login">{{ labels().forgotBackToLogin }}</a></p>
    }

  </div>
</div>
