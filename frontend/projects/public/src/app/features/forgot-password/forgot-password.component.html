<div class="auth-page">
  <div class="auth-card">

    <h1>Glömt lösenordet?</h1>

    @if (success()) {
      <div class="success-banner">
        <p>Om e-postadressen finns registrerad skickas en återställningslänk inom kort. Kontrollera din inkorg.</p>
        <a routerLink="/login">Tillbaka till inloggning</a>
      </div>
    } @else {
      <p class="description">Ange din e-postadress så skickar vi en länk för att återställa lösenordet.</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>E-postadress</mat-label>
          <input matInput type="email" formControlName="email" autocomplete="email" />
        </mat-form-field>

        <button mat-flat-button class="submit-btn full-width" type="submit"
                [disabled]="form.invalid || loading()">
          @if (loading()) {
            <mat-spinner diameter="20" />
          } @else {
            Skicka återställningslänk
          }
        </button>
      </form>

      <p class="footer-link"><a routerLink="/login">Tillbaka till inloggning</a></p>
    }

  </div>
</div>
