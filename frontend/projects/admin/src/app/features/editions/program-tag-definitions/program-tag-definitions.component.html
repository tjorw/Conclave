<div class="page-header">
  <h1 class="page-title">Programtaggar</h1>
  <p class="page-subtitle">{{ edition()?.name }}</p>
</div>

@if (error()) {
  <div class="error-banner">{{ error() }}</div>
}

<div class="action-bar">
  <span class="spacer"></span>
  <button mat-flat-button color="primary" (click)="openNew()" [disabled]="saving()">
    <mat-icon>add</mat-icon>
    Lägg till tagg
  </button>
</div>

@if (loading()) {
  <div class="spinner-center"><mat-spinner /></div>
} @else {
  <mat-card>
    <mat-card-content class="no-pad">
      <table class="data-table">
        <thead>
          <tr>
            <th>
              <button type="button" class="sort-header" (click)="sort.setSort('name')">
                Namn <mat-icon>{{ sort.sortIcon('name') }}</mat-icon>
              </button>
            </th>
            <th class="actions-col"></th>
          </tr>
        </thead>
        <tbody>
          @for (tag of sortedTags(edition()?.programTagDefinitions ?? []); track tag.name) {
            <tr class="navigable-row" (click)="openDetail(tag.name)">
              <td>{{ tag.name }}</td>
              <td class="row-actions">
                <mat-icon class="row-indicator">chevron_right</mat-icon>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="2" class="empty-cell">Inga programtaggar tillagda.</td>
            </tr>
          }
        </tbody>
      </table>
    </mat-card-content>
  </mat-card>
}
