@if (state.loading()) {
  <div class="spinner-wrapper"><mat-spinner diameter="48" /></div>
} @else if (state.error()) {
  <div class="page-header">
    <a class="back-link" (click)="navigateBack()" style="cursor: pointer">
      <mat-icon>arrow_back</mat-icon> Programtaggar
    </a>
  </div>
  <p class="error-message">{{ state.error() }}</p>
} @else if (edition(); as e) {
  <div class="page-header">
    <a class="back-link" (click)="navigateBack()" style="cursor: pointer">
      <mat-icon>arrow_back</mat-icon> Programtaggar
    </a>
    <h1 class="page-title">{{ isNew() ? 'Lägg till tagg' : 'Redigera tagg' }}</h1>
    <p class="page-subtitle">{{ e.name }}</p>
  </div>

  <mat-card class="detail-card">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="save()" class="detail-form">
        <mat-form-field appearance="outline">
          <mat-label>Namn</mat-label>
          <input matInput formControlName="name" />
          <mat-hint>Max 64 tecken</mat-hint>
        </mat-form-field>

        <div class="form-actions">
          @if (!isNew()) {
            <button
              mat-stroked-button
              color="warn"
              class="danger-action"
              type="button"
              (click)="delete()"
              [disabled]="state.saving()"
            >
              <mat-icon>delete</mat-icon>
              Ta bort
            </button>
          }
          <button mat-button type="button" (click)="navigateBack()">Avbryt</button>
          <button
            mat-flat-button
            color="primary"
            type="submit"
            [disabled]="form.invalid || state.saving()"
          >
            {{ isNew() ? 'Lägg till' : 'Spara' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
}
