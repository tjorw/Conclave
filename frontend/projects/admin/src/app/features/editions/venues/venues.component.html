<div class="page-header">
  <h1 class="page-title">Lokaler</h1>
  <p class="page-subtitle">{{ edition()?.name }}</p>
</div>

<app-help-panel panelKey="edition.venues" topic="edition-structure" />

@if (error()) {
  <div class="error-banner">{{ error() }}</div>
}

<div class="action-bar">
  <span class="spacer"></span>
  <button mat-flat-button color="primary" (click)="openNew()" [disabled]="saving()">
    <mat-icon>add</mat-icon>
    Lägg till lokal
  </button>
</div>

@if (loading()) {
  <div class="spinner-center"><mat-spinner /></div>
} @else {
  <mat-card>
    <mat-card-content class="no-pad">
      <table class="data-table">
        <thead>
          <tr>
            <th>
              <button type="button" class="sort-header" (click)="sort.setSort('name')">
                Namn <mat-icon>{{ sort.sortIcon('name') }}</mat-icon>
              </button>
            </th>
            <th>
              <button type="button" class="sort-header" (click)="sort.setSort('building')">
                Byggnad <mat-icon>{{ sort.sortIcon('building') }}</mat-icon>
              </button>
            </th>
            <th>
              <button type="button" class="sort-header" (click)="sort.setSort('description')">
                Beskrivning <mat-icon>{{ sort.sortIcon('description') }}</mat-icon>
              </button>
            </th>
            <th class="actions-col"></th>
          </tr>
        </thead>
        <tbody>
          @for (v of sortedVenues(edition()?.venues ?? []); track v.id) {
            <tr class="navigable-row" (click)="openDetail(v.id)">
              <td>{{ v.name }}</td>
              <td>{{ v.building }}</td>
              <td class="muted">{{ v.description || '–' }}</td>
              <td class="row-actions">
                <mat-icon class="row-indicator">chevron_right</mat-icon>
              </td>
            </tr>
          } @empty {
            <tr>
              <td colspan="4" class="empty-cell">Inga lokaler tillagda.</td>
            </tr>
          }
        </tbody>
      </table>
    </mat-card-content>
  </mat-card>
}
