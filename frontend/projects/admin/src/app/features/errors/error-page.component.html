<div class="error-page">
  <mat-icon class="error-icon">{{ page.icon }}</mat-icon>
  <p class="error-code">{{ page.code }}</p>
  <h1 class="error-title">{{ page.title }}</h1>
  <p class="error-description">{{ page.description }}</p>
  <a mat-flat-button color="primary" [routerLink]="page.link">{{ page.action }}</a>
</div>
