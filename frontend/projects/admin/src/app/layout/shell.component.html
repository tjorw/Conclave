<mat-sidenav-container class="shell-container">
  <mat-sidenav #sidenav mode="side" opened class="shell-sidenav">
    <div class="sidenav-header">
      <span class="sidenav-logo">Conclave</span>
      <span class="sidenav-subtitle">Administration</span>
    </div>

    <mat-nav-list>
      <a mat-list-item routerLink="dashboard" routerLinkActive="active-link">
        <mat-icon matListItemIcon>dashboard</mat-icon>
        <span matListItemTitle>Dashboard</span>
      </a>
      <a mat-list-item routerLink="persons" routerLinkActive="active-link">
        <mat-icon matListItemIcon>people</mat-icon>
        <span matListItemTitle>Personer</span>
      </a>
      <a mat-list-item routerLink="events" routerLinkActive="active-link">
        <mat-icon matListItemIcon>event</mat-icon>
        <span matListItemTitle>Evenemang</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar color="primary" class="shell-toolbar">
      <button mat-icon-button (click)="sidenav.toggle()" aria-label="Växla meny">
        <mat-icon>menu</mat-icon>
      </button>
      <span class="toolbar-spacer"></span>
      @if (editionContext.editions().length > 0) {
        <mat-form-field appearance="outline" class="edition-picker" subscriptSizing="dynamic">
          <mat-select
            [value]="editionContext.activeEdition()?.id"
            (selectionChange)="onEditionChange($event.value)"
            aria-label="Välj upplaga"
          >
            @for (edition of editionContext.editions(); track edition.id) {
              <mat-option [value]="edition.id">{{ edition.name }}</mat-option>
            }
          </mat-select>
        </mat-form-field>
      }
      <button mat-button (click)="logout()">
        <mat-icon>logout</mat-icon>
        Logga ut
      </button>
    </mat-toolbar>

    <main class="shell-main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
