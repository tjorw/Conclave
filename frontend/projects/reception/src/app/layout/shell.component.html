<div class="shell-container">
  <mat-toolbar color="primary" class="shell-toolbar">
    <span class="toolbar-brand">
      <mat-icon>storefront</mat-icon>
      <span>Receptionen</span>
      @if (editionContext.activeEdition(); as edition) {
        <span class="toolbar-edition">{{ edition.name }}</span>
      }
    </span>

    <span class="toolbar-spacer"></span>

    <nav class="toolbar-nav">
      <a mat-button routerLink="/checkin" routerLinkActive="active-nav-link">
        <mat-icon>how_to_reg</mat-icon> Incheckning
      </a>
      <a mat-button routerLink="/walkup" routerLinkActive="active-nav-link">
        <mat-icon>person_add</mat-icon> Walk-up
      </a>
    </nav>

    <span class="toolbar-spacer"></span>

    @if (sessionState.isAuthenticated()) {
      <div class="session-status"
        [class.session-status-warning]="sessionState.showExpiryWarning() || sessionState.sessionExpired()">
        <mat-icon>{{ sessionState.sessionExpired() ? 'lock_clock' : 'verified_user' }}</mat-icon>
      </div>
    }
    <button mat-button (click)="logout()">
      <mat-icon>logout</mat-icon> Logga ut
    </button>
  </mat-toolbar>

  <app-global-status-banner />

  <main class="shell-main">
    <router-outlet />
  </main>
</div>
