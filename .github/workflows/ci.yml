name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-

      - name: Restore
        run: dotnet restore backend/ConventionSystem.sln

      - name: Build
        run: dotnet build backend/ConventionSystem.sln --no-restore --configuration Release

      - name: Unit tests
        run: |
          dotnet test backend/tests/ConventionSystem.Domain.Tests \
            --no-build --configuration Release \
            --logger "console;verbosity=normal"
          dotnet test backend/tests/ConventionSystem.Application.Tests \
            --no-build --configuration Release \
            --logger "console;verbosity=normal"

      - name: Integration tests
        run: |
          dotnet test backend/tests/ConventionSystem.Integration.Tests \
            --no-build --configuration Release \
            --logger "console;verbosity=normal"
